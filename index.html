<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>To Do List</title>
  <meta name="description" content="오늘 할 일에 집중하는 가벼운 투두 리스트. 설치나 로그인 없이 브라우저에 저장됩니다.">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f7f7f5">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="To Do List">
  <meta property="og:title" content="To Do List">
  <meta property="og:description" content="오늘 할 일에 집중하는 가벼운 투두 리스트.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232f6f4e'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%23f7f7f5'/%3E%3C/svg%3E">
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%232f6f4e'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%23f7f7f5'/%3E%3C/svg%3E">
  <!-- 저장된 테마를 첫 페인트 전에 적용 (FOUC 방지) -->
  <script>
    try {
      var t = localStorage.getItem('todo.theme') || localStorage.getItem('oneul.theme');
      if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <style>
    /* ------------------------------------------------------------
       Tokens
       - 중립 베이스(warm gray) + 단일 강조색(moss green), 기한 지남에만 경고색
       - 라운드 규칙: 패널 16px / 상호작용 12px / 소형 컨트롤 10px·8px / 칩 pill
       - 글자 크기: 짝수 px, 최소 12px
       - 대비: 본문·라벨 4.5:1 이상, UI 경계 3:1 이상 (라이트·다크 모두)
       ------------------------------------------------------------ */
    :root {
      color-scheme: light;
      --bg: #f7f7f5;
      --surface: #fdfdfc;
      --surface-2: #efefec;
      --line: #e3e3de;
      --line-strong: #cfcfc8;
      --check-border: #8f8f88;
      --text: #1d1d1b;
      --text-2: #5f5f59;
      --text-3: #6f6f68;
      --accent: #2f6f4e;
      --accent-hover: #285f43;
      --accent-soft: #e4efe8;
      --on-accent: #f7f7f5;
      --danger: #b4432f;
      --danger-hover: #9c3826;
      --danger-soft: #f6e6e2;
      --on-danger: #fbf3f1;
      --shadow: 0 1px 2px rgba(29, 29, 27, .05), 0 10px 30px rgba(29, 29, 27, .07);
      --shadow-up: 0 -8px 24px rgba(29, 29, 27, .06);
      --ring: 0 0 0 3px rgba(47, 111, 78, .28);
      --toast-bg: #1d1d1b;
      --toast-text: #f7f7f5;
      --toast-action: #8fd0ae;
      --radius-panel: 16px;
      --radius: 12px;
      --radius-md: 10px;
      --radius-sm: 8px;
      --ease: cubic-bezier(.16, 1, .3, 1);
      --dur: 220ms;
    }
    :root[data-theme="dark"] {
      color-scheme: dark;
      --bg: #151514;
      --surface: #1e1e1c;
      --surface-2: #272725;
      --line: #30302d;
      --line-strong: #44443f;
      --check-border: #767670;
      --text: #ecece7;
      --text-2: #a6a69e;
      --text-3: #9a9a92;
      --accent: #7cc4a0;
      --accent-hover: #93d1b2;
      --accent-soft: #1f3128;
      --on-accent: #10201a;
      --danger: #e5836f;
      --danger-hover: #ee9a88;
      --danger-soft: #3a2420;
      --on-danger: #2a1410;
      --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 10px 30px rgba(0, 0, 0, .35);
      --shadow-up: 0 -8px 24px rgba(0, 0, 0, .35);
      --ring: 0 0 0 3px rgba(124, 196, 160, .35);
      --toast-bg: #ecece7;
      --toast-text: #151514;
      --toast-action: #2f6f4e;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        color-scheme: dark;
        --bg: #151514;
        --surface: #1e1e1c;
        --surface-2: #272725;
        --line: #30302d;
        --line-strong: #44443f;
        --check-border: #767670;
        --text: #ecece7;
        --text-2: #a6a69e;
        --text-3: #9a9a92;
        --accent: #7cc4a0;
        --accent-hover: #93d1b2;
        --accent-soft: #1f3128;
        --on-accent: #10201a;
        --danger: #e5836f;
        --danger-hover: #ee9a88;
        --danger-soft: #3a2420;
        --on-danger: #2a1410;
        --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 10px 30px rgba(0, 0, 0, .35);
        --shadow-up: 0 -8px 24px rgba(0, 0, 0, .35);
        --ring: 0 0 0 3px rgba(124, 196, 160, .35);
        --toast-bg: #ecece7;
        --toast-text: #151514;
        --toast-action: #2f6f4e;
      }
    }

    /* ------------------------------------------------------------ Base */
    *, *::before, *::after { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      min-height: 100dvh;
      background: var(--bg);
      color: var(--text);
      font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
      font-size: 16px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      overscroll-behavior-y: none;
    }
    button, input { font: inherit; color: inherit; }
    button { cursor: pointer; border: 0; background: none; padding: 0; }
    button:focus-visible, input:focus-visible, [tabindex]:focus-visible {
      outline: none;
      box-shadow: var(--ring);
    }
    .sr-only {
      position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
    }
    .ic {
      display: inline-block;
      width: 1em;
      height: 1em;
      flex: none;
      fill: currentColor;
      vertical-align: -0.125em;
    }
    kbd {
      font: inherit;
      font-size: 12px;
      padding: 1px 6px;
      border: 1px solid var(--line-strong);
      border-bottom-width: 2px;
      border-radius: 6px;
      background: var(--surface);
    }

    /* ------------------------------------------------------------ Layout */
    .app {
      max-width: 640px;
      margin: 0 auto;
      padding: 0 20px;
    }
    .top {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 16px;
      padding: 28px 0 20px;
    }
    .brand {
      margin: 0;
      font-size: 32px;
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1.1;
    }
    .date {
      margin: 6px 0 0;
      font-size: 14px;
      color: var(--text-2);
    }
    .top-right {
      display: flex;
      align-items: center;
      gap: 12px;
      padding-bottom: 2px;
    }
    .progress {
      margin: 0;
      font-size: 14px;
      color: var(--text-2);
      text-align: right;
      white-space: nowrap;
    }
    .icon-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 44px;
      height: 44px;
      border-radius: var(--radius);
      color: var(--text-2);
      font-size: 20px;
      transition: background-color var(--dur) var(--ease), color var(--dur) var(--ease), transform var(--dur) var(--ease);
    }
    .icon-btn:hover { background: var(--surface-2); color: var(--text); }
    .icon-btn:active { transform: scale(.96); }
    .icon-btn.sm { width: 40px; height: 40px; font-size: 18px; }
    .icon-btn.danger:hover { background: var(--danger-soft); color: var(--danger); }

    /* ------------------------------------------------------------ Composer */
    .composer {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius-panel);
      padding: 10px;
      box-shadow: var(--shadow);
    }
    .composer-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .composer-row input[type="text"] {
      flex: 1;
      min-width: 0;
      height: 40px;
      padding: 0 12px;
      border: 1px solid transparent;
      border-radius: var(--radius);
      background: var(--surface-2);
      font-size: 16px;
      transition: border-color var(--dur) var(--ease), background-color var(--dur) var(--ease);
    }
    .composer-row input[type="text"]::placeholder { color: var(--text-2); opacity: 1; }
    .composer-row input[type="text"]:focus { border-color: var(--line-strong); background: var(--surface); }
    .add-btn {
      flex: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      border-radius: var(--radius);
      background: var(--accent);
      color: var(--on-accent);
      font-size: 18px;
      transition: background-color var(--dur) var(--ease), transform var(--dur) var(--ease);
    }
    .add-btn:hover { background: var(--accent-hover); }
    .add-btn:active { transform: scale(.96); }
    .chips {
      display: flex;
      gap: 6px;
      margin-top: 8px;
      overflow-x: auto;
      scrollbar-width: none;
      padding: 2px;
      margin-left: -2px;
      margin-right: -2px;
    }
    .chips::-webkit-scrollbar { display: none; }
    .chip {
      flex: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 32px;
      padding: 0 12px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--text-2);
      font-size: 14px;
      font-weight: 500;
      transition: background-color var(--dur) var(--ease), color var(--dur) var(--ease), border-color var(--dur) var(--ease);
    }
    .chip:hover { border-color: var(--line-strong); color: var(--text); }
    .chip[aria-pressed="true"] {
      background: var(--accent-soft);
      border-color: transparent;
      color: var(--accent);
    }
    .composer-error {
      margin: 8px 4px 0;
      font-size: 14px;
      color: var(--danger);
    }

    /* ------------------------------------------------------------ Lists */
    .lists { padding: 20px 0 0; }
    /* 보드: 완료를 제외한 미완료 그룹을 한 컨테이너로 묶고, 하단에 선택 바를 둔다 */
    .board {
      border: 1px solid var(--line);
      border-radius: var(--radius-panel);
      background: color-mix(in srgb, var(--surface) 45%, var(--bg));
      padding: 16px;
      margin-bottom: 16px;
    }
    .board .allclear { margin-bottom: 16px; }
    .board .group { margin-bottom: 16px; }
    .board > :last-child { margin-bottom: 0; }
    .group { margin-bottom: 20px; }
    .group:last-child { margin-bottom: 0; }
    .group-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 0 4px 8px;
    }
    .group-title {
      margin: 0;
      font-size: 14px;
      font-weight: 600;
      color: var(--text-2);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .group-title .count {
      font-weight: 500;
      color: var(--text-3);
    }
    .group-title.is-overdue { color: var(--danger); }
    .group-title.is-done { color: var(--accent); }
    .group-title.is-done .count { color: var(--accent); opacity: .7; }
    .text-btn {
      height: 32px;
      padding: 0 10px;
      border-radius: var(--radius-sm);
      font-size: 14px;
      color: var(--text-2);
      transition: background-color var(--dur) var(--ease), color var(--dur) var(--ease);
    }
    .text-btn:hover { background: var(--surface-2); color: var(--text); }
    .tasks {
      list-style: none;
      margin: 0;
      padding: 0;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius-panel);
      overflow: hidden;
    }
    .task {
      display: flex;
      align-items: flex-start;
      gap: 4px;
      padding: 6px 8px 6px 4px;
      min-height: 56px;
      transition: background-color var(--dur) var(--ease);
    }
    .task + .task { border-top: 1px solid var(--line); }
    .task:hover { background: color-mix(in srgb, var(--surface-2) 55%, var(--surface)); }
    .check {
      position: relative;
      flex: none;
      width: 44px;
      height: 44px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--on-accent);
      border-radius: var(--radius);
    }
    .check::before {
      content: "";
      position: absolute;
      inset: 0;
      margin: auto;
      width: 22px;
      height: 22px;
      border-radius: 7px;
      border: 1.5px solid var(--check-border);
      background: transparent;
      transition: background-color var(--dur) var(--ease), border-color var(--dur) var(--ease), transform var(--dur) var(--ease);
    }
    .check .ic {
      position: relative;
      font-size: 14px;
      opacity: 0;
      transform: scale(.6);
      transition: opacity var(--dur) var(--ease), transform var(--dur) var(--ease);
    }
    .check:hover::before { border-color: var(--accent); }
    .check[aria-checked="true"]::before {
      background: var(--accent);
      border-color: var(--accent);
    }
    .check[aria-checked="true"] .ic { opacity: 1; transform: scale(1); }
    .check:active::before { transform: scale(.9); }
    .body {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: center;
      min-height: 44px;
      padding: 4px 0;
    }
    .title {
      display: block;
      max-width: 100%;
      text-align: left;
      font-size: 16px;
      line-height: 1.4;
      padding: 4px 6px;
      margin: 0 0 0 -6px;
      border-radius: var(--radius-sm);
      overflow-wrap: anywhere;
      transition: color var(--dur) var(--ease), background-color var(--dur) var(--ease);
    }
    .title:hover { background: var(--surface-2); }
    .task.is-done .title {
      color: var(--text-3);
      text-decoration: line-through;
      text-decoration-color: currentColor;
      text-decoration-thickness: 1.5px;
      text-underline-offset: 0;
    }
    .note {
      margin: 2px 0 0;
      font-size: 14px;
      line-height: 1.45;
      color: var(--text-2);
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 3;
      overflow: hidden;
    }
    .task.is-done .note { color: var(--text-3); }
    .due {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      margin: 2px 0 0;
      font-size: 12px;
      font-weight: 500;
      color: var(--text-3);
    }
    .due.is-today { color: var(--accent); }
    .due.is-overdue { color: var(--danger); }
    .task.is-done .due { color: var(--text-3); }
    .actions {
      flex: none;
      display: flex;
      align-items: center;
      align-self: center;
      opacity: 0;
      transition: opacity var(--dur) var(--ease);
    }
    .task:hover .actions,
    .task:focus-within .actions { opacity: 1; }
    @media (hover: none) { .actions { opacity: 1; } }

    /* Inline edit */
    .edit {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 4px 4px 6px 0;
    }
    .edit-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .edit input[type="text"] {
      flex: 1;
      min-width: 0;
      height: 40px;
      padding: 0 12px;
      border: 1px solid var(--line-strong);
      border-radius: var(--radius-md);
      background: var(--surface);
      font-size: 16px;
    }
    .edit textarea {
      width: 100%;
      min-height: 64px;
      padding: 8px 12px;
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      background: var(--surface);
      font: inherit;
      font-size: 16px;
      line-height: 1.45;
      color: var(--text);
      resize: vertical;
    }
    .edit textarea::placeholder, .edit input::placeholder { color: var(--text-3); opacity: 1; }
    .edit textarea:focus, .edit input[type="text"]:focus { outline: none; border-color: var(--line-strong); box-shadow: var(--ring); }
    .edit-label {
      display: block;
      margin-bottom: 4px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-2);
    }
    .edit-field { display: flex; flex-direction: column; }
    .btn {
      height: 36px;
      padding: 0 14px;
      border-radius: var(--radius-md);
      font-size: 14px;
      font-weight: 600;
      transition: background-color var(--dur) var(--ease), transform var(--dur) var(--ease);
    }
    .btn:active { transform: scale(.97); }
    .btn-primary { background: var(--accent); color: var(--on-accent); }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-ghost { color: var(--text-2); }
    .btn-ghost:hover { background: var(--surface-2); color: var(--text); }
    .btn-outline { border: 1px solid var(--line-strong); background: var(--surface); color: var(--text-2); }
    .btn-outline:hover { border-color: var(--text-3); background: var(--surface-2); color: var(--text); }
    .btn-danger { background: var(--danger); color: var(--on-danger); }
    .btn-danger:hover { background: var(--danger-hover); }

    /* Confirm dialog: 되돌리기 어려운 일괄 삭제 전 확인 */
    .confirm {
      width: min(calc(100vw - 32px), 360px);
      margin: auto;
      padding: 20px 20px 16px;
      border: 1px solid var(--line);
      border-radius: var(--radius-panel);
      background: var(--surface);
      color: var(--text);
      box-shadow: var(--shadow);
    }
    .confirm::backdrop { background: rgba(29, 29, 27, .36); }
    .confirm[open] { animation: cal-in 180ms var(--ease); }
    .confirm h2 {
      margin: 0 0 6px;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.01em;
    }
    .confirm p {
      margin: 0;
      font-size: 14px;
      color: var(--text-2);
    }
    .confirm-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 18px;
    }
    .confirm-actions .btn { height: 40px; padding: 0 16px; }
    @media (max-width: 639px) {
      .confirm { margin: auto auto calc(16px + env(safe-area-inset-bottom)); }
      .confirm-actions .btn { flex: 1; }
    }

    /* Empty & all-clear states */
    .empty {
      padding: 40px 4px;
      color: var(--text-2);
    }
    .empty h2 {
      margin: 0 0 6px;
      font-size: 20px;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.01em;
    }
    .empty p { margin: 0; font-size: 14px; }
    .allclear {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px 18px;
      margin-bottom: 20px;
      border-radius: var(--radius-panel);
      background: var(--accent-soft);
      color: var(--accent);
      font-size: 14px;
      font-weight: 600;
    }
    .allclear .ic { font-size: 22px; }

    /* Toast */
    .toast {
      position: fixed;
      left: 50%;
      bottom: calc(24px + env(safe-area-inset-bottom));
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 12px;
      max-width: calc(100vw - 32px);
      padding: 10px 10px 10px 16px;
      border-radius: var(--radius);
      background: var(--toast-bg);
      color: var(--toast-text);
      font-size: 14px;
      box-shadow: var(--shadow);
      z-index: 20;
      view-transition-name: toast;
      animation: toast-in var(--dur) var(--ease);
    }
    .toast[hidden] { display: none; }
    .toast button {
      height: 32px;
      padding: 0 10px;
      border-radius: var(--radius-sm);
      font-weight: 600;
      color: var(--toast-action);
      background: color-mix(in srgb, var(--toast-text) 10%, transparent);
    }
    .toast button:hover { background: color-mix(in srgb, var(--toast-text) 18%, transparent); }
    @keyframes toast-in {
      from { opacity: 0; transform: translate(-50%, 8px); }
      to { opacity: 1; transform: translate(-50%, 0); }
    }

    /* Footer */
    .foot {
      padding: 12px 4px 32px;
      font-size: 12px;
      color: var(--text-3);
    }
    @media (hover: none) { .foot .shortcut { display: none; } }

    /* 첫 방문 안내: 데이터가 브라우저별로 분리된다는 사실을 한 번만 알린다 */
    .notice {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      margin-top: 16px;
      padding: 14px 12px 14px 16px;
      border-radius: var(--radius-panel);
      background: var(--accent-soft);
      color: var(--text);
      font-size: 14px;
      line-height: 1.5;
    }
    .notice[hidden] { display: none; }
    .notice .ic { font-size: 20px; color: var(--accent); margin-top: 1px; }
    .notice p { flex: 1; margin: 0; }
    .notice strong { color: var(--accent); font-weight: 700; }
    .notice .btn { flex: none; align-self: center; }
    @media (max-width: 639px) {
      .notice { margin-top: 4px; margin-bottom: 8px; }
      .board { padding: 12px; margin-bottom: 12px; }
      .selbar { bottom: calc(120px + env(safe-area-inset-bottom)); margin: 0 0 20px; }
    }

    /* 선택 액션 바: 보드와 완료 그룹 사이의 독립 바. 화면 하단에 고정(sticky). 체크(선택)된 항목이 있을 때만 '완료' 활성화 */
    .selbar {
      position: sticky;
      bottom: 12px;
      z-index: 5;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin: 0 0 24px;
      padding: 8px 8px 8px 14px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      box-shadow: var(--shadow);
      font-size: 14px;
      font-weight: 600;
    }
    .selbar[hidden] { display: none; }
    .selbar-actions { display: flex; gap: 6px; }
    .selbar .hint { color: var(--text-3); font-weight: 500; }
    .selbar #selClear[hidden] { display: none; }
    .btn:disabled {
      cursor: not-allowed;
      background: var(--surface-2);
      color: var(--text-3);
      transform: none;
    }
    .task.is-selected { background: var(--accent-soft); }
    .task.is-selected:hover { background: var(--accent-soft); }

    .progress-mobile {
      display: none;
      margin: 0 4px 4px;
      font-size: 14px;
      color: var(--text-2);
    }

    /* ------------------------------------------------------------ Mobile
       < 640px: 입력창을 하단 고정(엄지 영역), 안전 영역·온스크린 키보드 반영, 토스트는 상단 */
    @media (max-width: 639px) {
      .app { padding: 0 16px; }
      .top { padding: 20px 0 8px; align-items: center; }
      .brand { font-size: 24px; }
      .progress { display: none; }
      .progress-mobile { display: block; }
      .lists { padding: 12px 0 0; }
      main { padding-bottom: calc(156px + env(safe-area-inset-bottom)); }
      .composer-row input[type="text"], .add-btn { height: 44px; }
      .add-btn { width: 44px; }
      .chip { height: 36px; }
      .composer {
        position: fixed;
        left: 0;
        right: 0;
        bottom: var(--kb-offset, 0px);
        z-index: 10;
        border-radius: 0;
        border-left: 0;
        border-right: 0;
        border-bottom: 0;
        padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
        box-shadow: var(--shadow-up);
      }
      .chips {
        margin-top: 8px;
        mask-image: linear-gradient(90deg, #000 calc(100% - 28px), transparent);
        -webkit-mask-image: linear-gradient(90deg, #000 calc(100% - 28px), transparent);
        padding-right: 28px;
      }
      .toast {
        top: calc(12px + env(safe-area-inset-top));
        bottom: auto;
        animation-name: toast-in-top;
      }
      @keyframes toast-in-top {
        from { opacity: 0; transform: translate(-50%, -8px); }
        to { opacity: 1; transform: translate(-50%, 0); }
      }
    }

    /* ------------------------------------------------------------ Calendar
       데스크톱: 칩 아래 팝오버 / 모바일: 바텀 시트. 네이티브 피커 대신 앱과 같은 언어로 그린다. */
    .cal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 29;
      background: rgba(29, 29, 27, .28);
      animation: fade-in 160ms var(--ease);
    }
    .cal-backdrop[hidden] { display: none; }
    .cal {
      position: fixed;
      z-index: 30;
      width: 312px;
      padding: 12px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius-panel);
      box-shadow: var(--shadow);
      transform-origin: top left;
      animation: cal-in 180ms var(--ease);
    }
    .cal[hidden] { display: none; }
    .cal.is-above { transform-origin: bottom left; }
    .cal-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 8px;
    }
    .cal-title {
      margin: 0;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -0.01em;
    }
    .cal-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 2px;
    }
    .cal-wd {
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 500;
      color: var(--text-3);
    }
    .cal-day {
      position: relative;
      height: 38px;
      border-radius: var(--radius-md);
      font-size: 14px;
      font-weight: 500;
      color: var(--text);
      transition: background-color var(--dur) var(--ease), color var(--dur) var(--ease), transform var(--dur) var(--ease);
    }
    .cal-day:hover { background: var(--surface-2); }
    .cal-day:active { transform: scale(.94); }
    .cal-day.is-outside { color: var(--text-3); font-weight: 400; }
    .cal-day.is-past { color: var(--text-3); }
    .cal-day.is-today { color: var(--accent); font-weight: 700; }
    .cal-day.is-today::after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: 5px;
      width: 4px;
      height: 4px;
      margin-left: -2px;
      border-radius: 50%;
      background: currentColor;
    }
    .cal-day[aria-selected="true"] {
      background: var(--accent);
      color: var(--on-accent);
      font-weight: 700;
    }
    .cal-day[aria-selected="true"]:hover { background: var(--accent-hover); }
    .cal-foot {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid var(--line);
    }
    @keyframes cal-in {
      from { opacity: 0; transform: translateY(-6px) scale(.98); }
      to { opacity: 1; transform: none; }
    }
    @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
    @media (max-width: 639px) {
      .cal {
        left: 0 !important;
        right: 0;
        top: auto !important;
        bottom: 0;
        width: auto;
        border-radius: var(--radius-panel) var(--radius-panel) 0 0;
        border-left: 0;
        border-right: 0;
        border-bottom: 0;
        padding: 12px 16px calc(16px + env(safe-area-inset-bottom));
        transform-origin: bottom center;
        animation-name: sheet-in;
      }
      .cal-day { height: 44px; font-size: 16px; }
      .cal-wd { height: 32px; }
      @keyframes sheet-in {
        from { opacity: 0; transform: translateY(24px); }
        to { opacity: 1; transform: none; }
      }
    }

    /* ------------------------------------------------------------ Motion
       View Transitions: 항목 추가/완료/삭제 시 위치 이동을 부드럽게 표현 */
    ::view-transition-group(*) { animation-duration: 260ms; animation-timing-function: var(--ease); }
    ::view-transition-old(root), ::view-transition-new(root) { animation-duration: 180ms; }
    ::view-transition-group(toast) { animation: none; }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition-duration: 0ms !important; animation-duration: 0ms !important; }
      ::view-transition-group(*), ::view-transition-old(*), ::view-transition-new(*) { animation: none !important; }
    }
  </style>
</head>

  <div class="app">
    <header class="top">
      <div>
        <h1 class="brand">To Do List</h1>
        <p class="date" id="todayLabel"></p>
      </div>
      <div class="top-right">
        <p class="progress" id="progress"></p>
        <button id="themeToggle" class="icon-btn" type="button" aria-label="다크 모드로 전환">
          <svg class="ic" aria-hidden="true"><use href="#i-moon"/></svg>
        </button>
      </div>
    </header>

    <main>
      <form id="composer" class="composer" novalidate>
        <label for="newTitle" class="sr-only">새 할 일</label>
        <div class="composer-row">
          <input id="newTitle" type="text" placeholder="무엇을 할까요?" autocomplete="off" maxlength="200" enterkeyhint="done">
          <button type="submit" class="add-btn" aria-label="할 일 추가">
            <svg class="ic" aria-hidden="true"><use href="#i-arrow-up"/></svg>
          </button>
        </div>
        <div class="chips" id="dueChips" role="group" aria-label="마감일">
          <button type="button" class="chip" data-due="none" aria-pressed="true">날짜 없음</button>
          <button type="button" class="chip" data-due="today" aria-pressed="false">오늘</button>
          <button type="button" class="chip" data-due="tomorrow" aria-pressed="false">내일</button>
          <button type="button" class="chip" id="dateChip" aria-pressed="false" aria-haspopup="dialog" aria-expanded="false">
            <svg class="ic" aria-hidden="true"><use href="#i-calendar"/></svg>
            <span id="pickedDateLabel">날짜 선택</span>
          </button>
        </div>
        <p class="composer-error" id="composerError" role="alert" hidden>할 일 내용을 입력해 주세요.</p>
      </form>

      <div class="notice" id="notice" role="note" hidden>
        <svg class="ic" aria-hidden="true"><use href="#i-info"/></svg>
        <p>할 일은 <strong>지금 쓰는 이 브라우저에만</strong> 저장돼요. 다른 브라우저나 기기에서는 보이지 않으니, 되도록 한 브라우저에서만 관리해 주세요.</p>
        <button type="button" class="btn btn-primary" id="noticeDismiss">알겠어요</button>
      </div>

      <p class="progress-mobile" id="progressMobile"></p>
      <section class="lists" id="lists" aria-label="할 일 목록"></section>
      <div class="selbar" id="selbar" hidden>
        <span id="selCount" aria-live="polite"></span>
        <div class="selbar-actions">
          <button type="button" class="btn btn-outline" id="selClear">선택 해제</button>
          <button type="button" class="btn btn-primary" id="selDone">완료</button>
        </div>
      </div>

      <footer class="foot">
        할 일은 이 브라우저에만 저장되고 다른 브라우저에서는 보이지 않아요.
        <span class="shortcut"> 단축키: <kbd>/</kbd> 입력창으로 이동</span>
      </footer>
    </main>
  </div>

  <div class="cal-backdrop" id="calBackdrop" hidden></div>
  <div class="cal" id="cal" role="dialog" aria-label="날짜 선택" hidden>
    <div class="cal-head">
      <button type="button" class="icon-btn sm" data-cal="prev" aria-label="이전 달"><svg class="ic" aria-hidden="true"><use href="#i-caret-left"/></svg></button>
      <h3 class="cal-title" id="calTitle" aria-live="polite"></h3>
      <button type="button" class="icon-btn sm" data-cal="next" aria-label="다음 달"><svg class="ic" aria-hidden="true"><use href="#i-caret-right"/></svg></button>
    </div>
    <div class="cal-grid" id="calGrid" role="grid" aria-labelledby="calTitle"></div>
    <div class="cal-foot">
      <button type="button" class="text-btn" data-cal="today">오늘</button>
      <button type="button" class="text-btn" data-cal="clear">날짜 없음</button>
    </div>
  </div>

  <dialog class="confirm" id="confirm" aria-labelledby="confirmTitle" aria-describedby="confirmDesc">
    <form method="dialog">
      <h2 id="confirmTitle">완료 항목을 지울까요?</h2>
      <p id="confirmDesc">지운 뒤 6초 안에는 되돌릴 수 있어요.</p>
      <div class="confirm-actions">
        <button type="submit" value="cancel" class="btn btn-ghost" id="confirmCancel">취소</button>
        <button type="submit" value="ok" class="btn btn-danger" id="confirmOk">지우기</button>
      </div>
    </form>
  </dialog>

  <div class="toast" id="toast" role="status" hidden>
    <span id="toastText"></span>
    <button type="button" id="undoBtn">되돌리기</button>
  </div>
  <p class="sr-only" id="announce" aria-live="polite"></p>

  <script>
  (() => {
    'use strict';

    /* ============================================================ Dates
       모든 날짜는 로컬 기준 'YYYY-MM-DD' 문자열로 다룬다. */
    const WEEKDAYS = ['일', '월', '화', '수', '목', '금', '토'];
    const pad = (n) => String(n).padStart(2, '0');
    const toKey = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
    const fromKey = (key) => {
      const [y, m, d] = key.split('-').map(Number);
      const dt = new Date(y, m - 1, d);
      dt.setFullYear(y); // 0~99년이 19xx로 해석되는 것을 방지
      return dt;
    };
    const todayKey = () => toKey(new Date());
    const addDays = (key, n) => {
      const d = fromKey(key);
      d.setDate(d.getDate() + n);
      return toKey(d);
    };
    const dayDiff = (fromKeyStr, toKeyStr) =>
      Math.round((fromKey(toKeyStr) - fromKey(fromKeyStr)) / 86400000);
    // 형식뿐 아니라 실제 존재하는 날짜인지(2월 31일 등 롤오버 방지)까지 확인
    const isValidKey = (key) =>
      typeof key === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(key) && toKey(fromKey(key)) === key;

    function formatLongDate(key) {
      const d = fromKey(key);
      return `${d.getMonth() + 1}월 ${d.getDate()}일 ${WEEKDAYS[d.getDay()]}요일`;
    }
    function formatShortDate(key, today) {
      const d = fromKey(key);
      const sameYear = d.getFullYear() === fromKey(today).getFullYear();
      const base = `${d.getMonth() + 1}월 ${d.getDate()}일`;
      return sameYear ? base : `${d.getFullYear()}년 ${base}`;
    }
    // 상대 표현 + 괄호 안 실제 날짜: '오늘 (9월 9일)', '3일 지남 (9월 6일)', '9월 12일 (금)'
    function formatDue(key, today) {
      const diff = dayDiff(today, key);
      const abs = formatShortDate(key, today);
      if (diff === 0) return `오늘 (${abs})`;
      if (diff === 1) return `내일 (${abs})`;
      if (diff === -1) return `어제 (${abs})`;
      if (diff < -1) return `${-diff}일 지남 (${abs})`;
      return `${abs} (${WEEKDAYS[fromKey(key).getDay()]})`;
    }

    /* ============================================================ Storage */
    const STORAGE_KEY = 'todo.v1';
    const THEME_KEY = 'todo.theme';
    const NOTICE_KEY = 'todo.notice.v1';
    const LEGACY_KEYS = { tasks: 'oneul.v1', theme: 'oneul.theme' }; // 초기 배포명(oneul)에서 이전
    const ID_RE = /^[A-Za-z0-9_-]{1,64}$/;

    function loadTasks() {
      try {
        let raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) {
          raw = localStorage.getItem(LEGACY_KEYS.tasks);
          if (raw) { localStorage.setItem(STORAGE_KEY, raw); localStorage.removeItem(LEGACY_KEYS.tasks); }
        }
        if (!raw) return [];
        const data = JSON.parse(raw);
        const list = Array.isArray(data) ? data : Array.isArray(data?.tasks) ? data.tasks : [];
        return list
          .filter((t) => t && typeof t.id === 'string' && ID_RE.test(t.id) && typeof t.title === 'string')
          .map((t) => ({
            id: t.id,
            title: t.title.slice(0, 200),
            note: typeof t.note === 'string' ? t.note.slice(0, 1000) : '',
            done: Boolean(t.done),
            due: isValidKey(t.due) ? t.due : null,
            createdAt: Number(t.createdAt) || Date.now(),
            completedAt: t.completedAt ? Number(t.completedAt) : null,
          }));
      } catch {
        return [];
      }
    }
    function saveTasks(tasks) {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({ tasks }));
      } catch {
        /* 저장 공간 부족 등: 메모리 상태는 유지 */
      }
    }

    /* ============================================================ State */
    const uid = () =>
      (globalThis.crypto && typeof globalThis.crypto.randomUUID === 'function'
        ? globalThis.crypto.randomUUID()
        : `${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 10)}`);

    const state = {
      tasks: loadTasks(),
      composerDue: null, // null | 'today' | 'tomorrow' | 'YYYY-MM-DD' (자정을 넘겨도 의미가 유지되도록 토큰으로 보관)
      editingId: null,
      editDraft: null, // 편집 중 재렌더 시 입력값 보존 { title, due }
      selected: new Set(), // 체크(선택)된 미완료 항목 id. 저장하지 않음
      today: todayKey(),
      undo: null, // { tasks: Task[], timer }
    };
    const resolveDue = (token) => {
      if (!token) return null;
      if (token === 'today') return state.today;
      if (token === 'tomorrow') return addDays(state.today, 1);
      return isValidKey(token) ? token : null;
    };

    /* ============================================================ Grouping */
    const GROUPS = [
      { key: 'overdue', label: '기한 지남' },
      { key: 'today', label: '오늘' },
      { key: 'upcoming', label: '예정' },
      { key: 'someday', label: '날짜 없음' },
      { key: 'done', label: '완료' },
    ];
    function groupOf(task, today) {
      if (task.done) return 'done';
      if (!task.due) return 'someday';
      const diff = dayDiff(today, task.due);
      if (diff < 0) return 'overdue';
      if (diff === 0) return 'today';
      return 'upcoming';
    }
    function buildGroups(tasks, today) {
      const buckets = Object.fromEntries(GROUPS.map((g) => [g.key, []]));
      for (const t of tasks) buckets[groupOf(t, today)].push(t);
      const byDueThenNewest = (a, b) => {
        if (a.due && b.due && a.due !== b.due) return a.due < b.due ? -1 : 1;
        return b.createdAt - a.createdAt;
      };
      buckets.overdue.sort(byDueThenNewest);
      buckets.today.sort((a, b) => b.createdAt - a.createdAt);
      buckets.upcoming.sort(byDueThenNewest);
      buckets.someday.sort((a, b) => b.createdAt - a.createdAt);
      buckets.done.sort((a, b) => (b.completedAt || 0) - (a.completedAt || 0));
      return GROUPS.map((g) => ({ ...g, tasks: buckets[g.key] })).filter((g) => g.tasks.length > 0);
    }

    /* ============================================================ DOM refs */
    const $ = (sel) => document.querySelector(sel);
    const els = {
      todayLabel: $('#todayLabel'),
      progress: $('#progress'),
      progressMobile: $('#progressMobile'),
      themeToggle: $('#themeToggle'),
      composer: $('#composer'),
      newTitle: $('#newTitle'),
      dueChips: $('#dueChips'),
      dateChip: $('#dateChip'),
      pickedDateLabel: $('#pickedDateLabel'),
      cal: $('#cal'),
      calBackdrop: $('#calBackdrop'),
      calTitle: $('#calTitle'),
      calGrid: $('#calGrid'),
      composerError: $('#composerError'),
      lists: $('#lists'),
      toast: $('#toast'),
      toastText: $('#toastText'),
      undoBtn: $('#undoBtn'),
      announce: $('#announce'),
      notice: $('#notice'),
      noticeDismiss: $('#noticeDismiss'),
      selbar: $('#selbar'),
      selCount: $('#selCount'),
      selClear: $('#selClear'),
      selDone: $('#selDone'),
      confirm: $('#confirm'),
      confirmTitle: $('#confirmTitle'),
      confirmCancel: $('#confirmCancel'),
      confirmOk: $('#confirmOk'),
    };

    const escapeHtml = (s) =>
      s.replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const icon = (name) => `<svg class="ic" aria-hidden="true"><use href="#i-${name}"/></svg>`;
    const reducedMotion = () => window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const taskSel = (id) => `.task[data-id="${id}"]`; // id는 ID_RE로 검증된 안전한 문자만 포함

    /* ============================================================ Render */
    function renderHeader() {
      els.todayLabel.textContent = formatLongDate(state.today);
      const todays = state.tasks.filter((t) => t.due === state.today);
      const active = state.tasks.filter((t) => !t.done);
      let text;
      if (todays.length > 0) {
        const done = todays.filter((t) => t.done).length;
        text = done === todays.length ? `오늘 ${todays.length}개 모두 완료` : `오늘 ${todays.length}개 중 ${done}개 완료`;
      } else if (active.length > 0) {
        text = `남은 할 일 ${active.length}개`;
      } else {
        text = '';
      }
      els.progress.textContent = text;
      els.progressMobile.textContent = text;
    }

    function taskHtml(task) {
      const editing = state.editingId === task.id;
      const dueClass = task.due
        ? dayDiff(state.today, task.due) < 0 && !task.done ? 'is-overdue' : task.due === state.today ? 'is-today' : ''
        : '';
      const safeTitle = escapeHtml(task.title);
      let body;
      if (editing) {
        const draft = state.editDraft || { title: task.title, note: task.note || '', due: task.due || '' };
        body = `<form class="edit" data-edit="${task.id}">
             <div class="edit-field">
               <label class="edit-label" for="edit-${task.id}">할 일</label>
               <input id="edit-${task.id}" type="text" value="${escapeHtml(draft.title)}" maxlength="200" autocomplete="off">
             </div>
             <div class="edit-field">
               <label class="edit-label" for="note-${task.id}">메모</label>
               <textarea id="note-${task.id}" name="note" rows="2" maxlength="1000" placeholder="메모 (선택)">${escapeHtml(draft.note)}</textarea>
             </div>
             <div class="edit-row">
               <input type="hidden" name="due" value="${escapeHtml(draft.due)}">
               <button type="button" class="chip" data-action="edit-date" aria-haspopup="dialog" aria-expanded="false" aria-pressed="${Boolean(draft.due)}">
                 ${icon('calendar')}<span>${draft.due ? formatDue(draft.due, state.today) : '날짜 없음'}</span>
               </button>
               <button type="submit" class="btn btn-primary">저장</button>
               <button type="button" class="btn btn-ghost" data-action="cancel">취소</button>
             </div>
           </form>`;
      } else {
        body = `<div class="body">
             <button type="button" class="title" data-action="edit" title="수정">${safeTitle}</button>
             ${task.note ? `<p class="note">${escapeHtml(task.note)}</p>` : ''}
             ${task.due ? `<span class="due ${dueClass}">${icon('calendar')}${formatDue(task.due, state.today)}</span>` : ''}
           </div>`;
      }
      const selected = !task.done && state.selected.has(task.id);
      return `<li class="task ${task.done ? 'is-done' : ''} ${selected ? 'is-selected' : ''}" data-id="${task.id}" style="view-transition-name: t-${task.id}">
        <button type="button" class="check" role="checkbox" aria-checked="${task.done || selected}" data-action="toggle" aria-label="${safeTitle}${task.done ? ', 완료 취소' : ', 선택'}">
          ${icon('check')}
        </button>
        ${body}
        ${editing ? '' : `<div class="actions">
          <button type="button" class="icon-btn sm" data-action="edit" aria-label="${safeTitle} 수정">${icon('pencil')}</button>
          <button type="button" class="icon-btn sm danger" data-action="delete" aria-label="${safeTitle} 삭제">${icon('trash')}</button>
        </div>`}
      </li>`;
    }

    function captureEditDraft() {
      if (!state.editingId) { state.editDraft = null; return; }
      const form = els.lists.querySelector('form[data-edit]');
      if (!form) return;
      state.editDraft = {
        title: form.querySelector('input[type="text"]').value,
        note: form.querySelector('textarea[name="note"]').value,
        due: form.querySelector('input[name="due"]').value,
      };
    }

    function renderSelbar() {
      const n = state.selected.size;
      els.selbar.hidden = state.tasks.length === 0; // 할 일이 하나도 없을 때만 숨김
      els.selCount.textContent = n > 0 ? `${n}개 선택` : '할 일을 체크한 뒤 완료를 누르세요';
      els.selCount.classList.toggle('hint', n === 0);
      els.selClear.hidden = n === 0;
      els.selDone.disabled = n === 0;
    }

    function renderLists() {
      captureEditDraft();
      const activeIds = new Set(state.tasks.filter((t) => !t.done).map((t) => t.id));
      for (const id of [...state.selected]) if (!activeIds.has(id)) state.selected.delete(id);
      renderSelbar();
      const groups = buildGroups(state.tasks, state.today);
      els.selbar.remove(); // innerHTML 교체 전에 분리해 두었다가 제자리에 다시 끼운다
      if (groups.length === 0) {
        els.lists.innerHTML = `<div class="empty">
          <h2>아직 할 일이 없어요</h2>
          <p>오늘 하고 싶은 일을 하나만 적어보세요.</p>
        </div>`;
        els.lists.append(els.selbar);
        return;
      }
      const activeCount = state.tasks.filter((t) => !t.done).length;
      const allClear = activeCount === 0
        ? `<div class="allclear" style="view-transition-name: allclear">${icon('confetti')}남은 할 일이 없어요. 오늘도 수고했어요.</div>`
        : '';
      const groupHtml = (g) => {
        const isDone = g.key === 'done';
        const action = isDone
          ? `<button type="button" class="text-btn" data-action="clear-done">완료 항목 지우기</button>`
          : '';
        return `<section class="group" aria-labelledby="g-${g.key}">
          <div class="group-head">
            <h2 class="group-title ${g.key === 'overdue' ? 'is-overdue' : isDone ? 'is-done' : ''}" id="g-${g.key}">${g.label} <span class="count">${g.tasks.length}</span></h2>
            ${action}
          </div>
          <ul class="tasks">${g.tasks.map(taskHtml).join('')}</ul>
        </section>`;
      };
      const activeHtml = groups.filter((g) => g.key !== 'done').map(groupHtml).join('');
      const doneHtml = groups.filter((g) => g.key === 'done').map(groupHtml).join('');
      // 보드(미완료 그룹 + 선택 바) 와 완료 그룹을 분리
      els.lists.innerHTML = `<div class="board" id="board" style="view-transition-name: board">${allClear}${activeHtml}</div><div id="selbarSlot"></div>${doneHtml}`;
      els.lists.querySelector('#selbarSlot').replaceWith(els.selbar);
      if (cal.open && cal.anchor && !cal.anchor.isConnected) closeCalendar({ restoreFocus: false });
    }

    function renderComposer() {
      const token = state.composerDue;
      const resolved = resolveDue(token);
      const isCustom = Boolean(resolved) && token !== 'today' && token !== 'tomorrow';
      els.dueChips.querySelectorAll('.chip[data-due]').forEach((chip) => {
        const k = chip.dataset.due;
        const on = (k === 'none' && !token) || (k === 'today' && token === 'today') || (k === 'tomorrow' && token === 'tomorrow');
        chip.setAttribute('aria-pressed', String(on));
      });
      els.dateChip.setAttribute('aria-pressed', String(isCustom));
      els.pickedDateLabel.textContent = isCustom ? formatDue(resolved, state.today) : '날짜 선택';
    }

    function render() {
      renderHeader();
      renderComposer();
      renderLists();
    }

    function commit({ animate = true, focusSelector = null, focusEl = null } = {}) {
      saveTasks(state.tasks);
      const run = () => {
        render();
        const el = focusSelector ? els.lists.querySelector(focusSelector) : focusEl;
        if (el) el.focus();
      };
      if (animate && document.startViewTransition && !reducedMotion()) {
        document.startViewTransition(run);
      } else {
        run();
      }
    }

    /* ============================================================ Toast / Undo */
    function showUndo(removed, message) {
      clearTimeout(state.undo?.timer);
      state.undo = { tasks: removed, timer: setTimeout(hideToast, 6000) };
      els.toast.hidden = false;
      els.toastText.textContent = '';
      // 영역이 보인 뒤 텍스트를 넣어야 스크린리더가 변경을 안정적으로 읽는다
      requestAnimationFrame(() => { els.toastText.textContent = message; });
    }
    function hideToast() {
      clearTimeout(state.undo?.timer);
      state.undo = null;
      els.toast.hidden = true;
    }
    els.undoBtn.addEventListener('click', () => {
      if (!state.undo) return;
      const restored = state.undo.tasks;
      state.tasks = state.tasks.concat(restored);
      hideToast();
      commit({ focusSelector: restored[0] ? `${taskSel(restored[0].id)} .check` : null });
      announce('되돌렸어요.');
    });

    function announce(msg) {
      els.announce.textContent = '';
      requestAnimationFrame(() => { els.announce.textContent = msg; });
    }

    /* ============================================================ Actions */
    function addTask(title, due) {
      state.tasks.push({ id: uid(), title, note: '', done: false, due, createdAt: Date.now(), completedAt: null });
    }
    function toggleTask(id) {
      const t = state.tasks.find((x) => x.id === id);
      if (!t) return;
      t.done = !t.done;
      t.completedAt = t.done ? Date.now() : null;
    }
    function deleteTasks(ids) {
      const set = new Set(ids);
      const removed = state.tasks.filter((t) => set.has(t.id));
      state.tasks = state.tasks.filter((t) => !set.has(t.id));
      return removed;
    }
    function updateTask(id, patch) {
      const t = state.tasks.find((x) => x.id === id);
      if (t) Object.assign(t, patch);
    }
    // 삭제 후 포커스가 body로 떨어지지 않도록 이웃 항목 → 되돌리기 버튼 순으로 이동
    function neighborFocus(li) {
      const next = li.nextElementSibling || li.previousElementSibling;
      return next ? `${taskSel(next.dataset.id)} .check` : null;
    }

    /* ============================================================ Events: composer */
    els.composer.addEventListener('submit', (e) => {
      e.preventDefault();
      const title = els.newTitle.value.trim();
      if (!title) {
        els.composerError.hidden = false;
        els.newTitle.focus();
        return;
      }
      els.composerError.hidden = true;
      addTask(title, resolveDue(state.composerDue));
      els.newTitle.value = '';
      commit();
      announce('할 일을 추가했어요.');
      els.newTitle.focus();
    });
    els.newTitle.addEventListener('input', () => { els.composerError.hidden = true; });

    els.dueChips.addEventListener('click', (e) => {
      const chip = e.target.closest('.chip[data-due]');
      if (!chip) return;
      const k = chip.dataset.due;
      state.composerDue = k === 'none' ? null : k;
      renderComposer();
      els.newTitle.focus();
    });
    els.dateChip.addEventListener('click', () => {
      if (cal.open && cal.anchor === els.dateChip) { closeCalendar(); return; }
      openCalendar({
        anchor: els.dateChip,
        value: resolveDue(state.composerDue),
        onSelect: (key) => {
          // 오늘/내일을 고르면 해당 칩이 켜지도록 토큰으로 정규화. null이면 날짜 없음
          state.composerDue = key === state.today ? 'today' : key === addDays(state.today, 1) ? 'tomorrow' : key;
          renderComposer();
        },
      });
    });

    /* ============================================================ Calendar
       role=grid + roving tabindex. 방향키/Home/End/PageUp/PageDown/Enter/Esc 지원. */
    const cal = { open: false, anchor: null, value: null, view: null, focusKey: null, onSelect: null };
    const monthStart = (key) => key.slice(0, 7) + '-01';
    const shiftMonth = (key, n) => {
      const d = fromKey(monthStart(key));
      d.setMonth(d.getMonth() + n);
      return toKey(d);
    };
    const isMobile = () => window.matchMedia('(max-width: 639px)').matches;

    function renderCalendar() {
      const first = fromKey(monthStart(cal.view));
      els.calTitle.textContent = `${first.getFullYear()}년 ${first.getMonth() + 1}월`;
      const start = fromKey(monthStart(cal.view));
      start.setDate(1 - first.getDay()); // 일요일 시작, 항상 6주(42칸)로 높이 고정
      const cells = [];
      for (const w of WEEKDAYS) cells.push(`<span class="cal-wd" role="columnheader">${w}</span>`);
      const viewMonth = first.getMonth();
      for (let i = 0; i < 42; i++) {
        const d = new Date(start);
        d.setDate(start.getDate() + i);
        const key = toKey(d);
        const cls = ['cal-day'];
        if (d.getMonth() !== viewMonth) cls.push('is-outside');
        if (key === state.today) cls.push('is-today');
        else if (key < state.today) cls.push('is-past');
        const selected = key === cal.value;
        const focused = key === cal.focusKey;
        const label = `${d.getMonth() + 1}월 ${d.getDate()}일 ${WEEKDAYS[d.getDay()]}요일${key === state.today ? ', 오늘' : ''}`;
        cells.push(`<button type="button" class="${cls.join(' ')}" role="gridcell" data-date="${key}"
          tabindex="${focused ? 0 : -1}" aria-selected="${selected}" ${key === state.today ? 'aria-current="date"' : ''} aria-label="${label}">${d.getDate()}</button>`);
      }
      els.calGrid.innerHTML = cells.join('');
    }

    function placeCalendar() {
      const el = els.cal;
      el.classList.remove('is-above');
      if (isMobile()) { el.style.left = ''; el.style.top = ''; return; }
      const r = cal.anchor.getBoundingClientRect();
      const w = el.offsetWidth || 312;
      const h = el.offsetHeight || 360;
      const left = Math.max(12, Math.min(r.left, window.innerWidth - w - 12));
      let top = r.bottom + 8;
      if (top + h > window.innerHeight - 12 && r.top - 8 - h > 12) {
        top = r.top - 8 - h;
        el.classList.add('is-above');
      }
      el.style.left = `${Math.round(left)}px`;
      el.style.top = `${Math.round(top)}px`;
    }

    function openCalendar({ anchor, value, onSelect }) {
      cal.open = true;
      cal.anchor = anchor;
      cal.value = value || null;
      cal.onSelect = onSelect;
      cal.focusKey = cal.value || state.today;
      cal.view = monthStart(cal.focusKey);
      anchor.setAttribute('aria-expanded', 'true');
      els.calBackdrop.hidden = !isMobile();
      els.cal.hidden = false;
      renderCalendar();
      placeCalendar();
      els.calGrid.querySelector('[tabindex="0"]')?.focus();
      window.addEventListener('scroll', placeCalendar, { passive: true });
      window.addEventListener('resize', placeCalendar);
    }

    function closeCalendar({ restoreFocus = true } = {}) {
      if (!cal.open) return;
      cal.open = false;
      els.cal.hidden = true;
      els.calBackdrop.hidden = true;
      window.removeEventListener('scroll', placeCalendar);
      window.removeEventListener('resize', placeCalendar);
      const anchor = cal.anchor;
      cal.anchor = null;
      if (anchor) {
        anchor.setAttribute('aria-expanded', 'false');
        if (restoreFocus && anchor.isConnected) anchor.focus();
      }
    }

    function pickDate(key) {
      const fn = cal.onSelect;
      closeCalendar();
      if (fn) fn(key);
    }

    function moveFocus(key) {
      cal.focusKey = key;
      if (monthStart(key) !== cal.view) cal.view = monthStart(key);
      renderCalendar();
      els.calGrid.querySelector('[tabindex="0"]')?.focus();
    }

    els.cal.addEventListener('click', (e) => {
      const nav = e.target.closest('[data-cal]');
      if (nav) {
        const k = nav.dataset.cal;
        if (k === 'prev' || k === 'next') {
          cal.view = shiftMonth(cal.view, k === 'prev' ? -1 : 1);
          if (monthStart(cal.focusKey) !== cal.view) cal.focusKey = cal.view;
          renderCalendar();
        } else if (k === 'today') {
          pickDate(state.today);
        } else if (k === 'clear') {
          pickDate(null);
        }
        return;
      }
      const day = e.target.closest('.cal-day');
      if (day) pickDate(day.dataset.date);
    });

    els.cal.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') { e.preventDefault(); closeCalendar(); return; }
      const day = e.target.closest('.cal-day');
      if (!day) return;
      const key = day.dataset.date;
      const map = {
        ArrowLeft: () => addDays(key, -1),
        ArrowRight: () => addDays(key, 1),
        ArrowUp: () => addDays(key, -7),
        ArrowDown: () => addDays(key, 7),
        Home: () => addDays(key, -fromKey(key).getDay()),
        End: () => addDays(key, 6 - fromKey(key).getDay()),
        PageUp: () => shiftMonth(key, -1).slice(0, 8) + key.slice(8),
        PageDown: () => shiftMonth(key, 1).slice(0, 8) + key.slice(8),
      };
      if (map[e.key]) {
        e.preventDefault();
        let next = map[e.key]();
        if (!isValidKey(next)) next = addDays(shiftMonth(next, 1), -1); // 31일 → 다음 달 말일 보정
        moveFocus(next);
      } else if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        pickDate(key);
      }
    });

    els.calBackdrop.addEventListener('click', () => closeCalendar());
    document.addEventListener('pointerdown', (e) => {
      if (!cal.open) return;
      if (els.cal.contains(e.target) || (cal.anchor && cal.anchor.contains(e.target))) return;
      closeCalendar({ restoreFocus: false });
    });
    els.cal.addEventListener('focusout', (e) => {
      if (!cal.open || isMobile()) return;
      if (e.relatedTarget && !els.cal.contains(e.relatedTarget)) closeCalendar({ restoreFocus: false });
    });

    /* ============================================================ Selection bar */
    els.selDone.addEventListener('click', () => {
      const ids = [...state.selected];
      if (ids.length === 0) return;
      const now = Date.now();
      for (const t of state.tasks) if (ids.includes(t.id)) { t.done = true; t.completedAt = now; }
      state.selected.clear();
      commit({ focusEl: els.newTitle });
      announce(`${ids.length}개를 완료했어요.`);
    });
    els.selClear.addEventListener('click', () => {
      state.selected.clear();
      render();
      els.newTitle.focus();
    });

    /* ============================================================ Confirm dialog
       네이티브 confirm() 대신 <dialog>. 취소가 기본 포커스, Esc/백드롭으로 닫힘. */
    function askConfirm({ title, onConfirm, returnFocus }) {
      const dlg = els.confirm;
      els.confirmTitle.textContent = title;
      const done = () => {
        dlg.removeEventListener('close', done);
        const ok = dlg.returnValue === 'ok';
        dlg.returnValue = '';
        if (ok) onConfirm();
        else if (returnFocus && returnFocus.isConnected) returnFocus.focus();
      };
      dlg.addEventListener('close', done);
      if (typeof dlg.showModal === 'function') dlg.showModal();
      else dlg.setAttribute('open', '');
      els.confirmCancel.focus();
    }
    els.confirm.addEventListener('click', (e) => {
      if (e.target === els.confirm) { els.confirm.returnValue = 'cancel'; els.confirm.close(); }
    });
    // showModal 미지원 환경(구형 브라우저) 폴백: form submit으로 close 흉내
    els.confirm.querySelector('form').addEventListener('submit', (e) => {
      if (typeof els.confirm.showModal === 'function') return;
      e.preventDefault();
      els.confirm.returnValue = e.submitter ? e.submitter.value : 'cancel';
      els.confirm.removeAttribute('open');
      els.confirm.dispatchEvent(new Event('close'));
    });

    function clearDone() {
      const ids = state.tasks.filter((t) => t.done).map((t) => t.id);
      const removed = deleteTasks(ids);
      showUndo(removed, `완료 항목 ${removed.length}개를 지웠어요.`);
      commit({ focusEl: els.undoBtn });
      announce(`완료 항목 ${removed.length}개를 지웠어요.`);
    }

    /* ============================================================ Events: lists (delegated) */
    els.lists.addEventListener('click', (e) => {
      const btn = e.target.closest('[data-action]');
      if (!btn) return;
      const action = btn.dataset.action;
      if (action === 'clear-done') {
        const count = state.tasks.filter((t) => t.done).length;
        askConfirm({
          title: `완료 항목 ${count}개를 지울까요?`,
          onConfirm: clearDone,
          returnFocus: btn,
        });
        return;
      }
      const li = btn.closest('.task');
      if (!li) return;
      const id = li.dataset.id;
      if (action === 'toggle') {
        const t = state.tasks.find((x) => x.id === id);
        if (!t) return;
        if (t.done) {
          // 완료 목록의 체크를 누르면 바로 완료 취소
          toggleTask(id);
          commit({ focusSelector: `${taskSel(id)} .check` });
          announce('완료를 취소했어요.');
        } else {
          // 미완료 항목의 체크는 '선택'. 완료 버튼을 눌러야 완료 목록으로 이동
          if (state.selected.has(id)) state.selected.delete(id); else state.selected.add(id);
          render();
          els.lists.querySelector(`${taskSel(id)} .check`)?.focus();
          announce(state.selected.has(id) ? `선택했어요. ${state.selected.size}개 선택됨` : '선택을 해제했어요.');
        }
      } else if (action === 'delete') {
        const focusSelector = neighborFocus(li);
        const removed = deleteTasks([id]);
        showUndo(removed, '할 일을 지웠어요.');
        commit({ focusSelector, focusEl: focusSelector ? null : els.undoBtn });
        announce('할 일을 지웠어요. 되돌릴 수 있어요.');
      } else if (action === 'edit') {
        state.editingId = id;
        state.editDraft = null;
        render();
        const input = els.lists.querySelector(`#edit-${id}`);
        if (input) { input.focus(); input.setSelectionRange(input.value.length, input.value.length); }
      } else if (action === 'edit-date') {
        const form = btn.closest('form[data-edit]');
        const hidden = form.querySelector('input[name="due"]');
        openCalendar({
          anchor: btn,
          value: isValidKey(hidden.value) ? hidden.value : null,
          onSelect: (key) => {
            hidden.value = key || '';
            btn.setAttribute('aria-pressed', String(Boolean(key)));
            btn.querySelector('span').textContent = key ? formatDue(key, state.today) : '날짜 없음';
          },
        });
      } else if (action === 'cancel') {
        state.editingId = null;
        state.editDraft = null;
        render();
        els.lists.querySelector(`${taskSel(id)} .title`)?.focus();
      }
    });

    els.lists.addEventListener('submit', (e) => {
      const form = e.target.closest('form[data-edit]');
      if (!form) return;
      e.preventDefault();
      const id = form.dataset.edit;
      const title = form.querySelector('input[type="text"]').value.trim();
      const note = form.querySelector('textarea[name="note"]').value.trim();
      const dueVal = form.querySelector('input[name="due"]').value;
      state.editingId = null;
      state.editDraft = null;
      if (!title) {
        // 빈 제목으로 저장하면 삭제로 간주하고 되돌리기를 제공
        const focusSelector = neighborFocus(form.closest('.task'));
        const removed = deleteTasks([id]);
        showUndo(removed, '내용이 비어서 할 일을 지웠어요.');
        commit({ focusSelector, focusEl: focusSelector ? null : els.undoBtn });
        return;
      }
      updateTask(id, { title, note, due: isValidKey(dueVal) ? dueVal : null });
      commit({ focusSelector: `${taskSel(id)} .title` });
      announce('수정했어요.');
    });

    els.lists.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && (e.ctrlKey || e.metaKey) && e.target.tagName === 'TEXTAREA') {
        e.preventDefault();
        e.target.closest('form[data-edit]')?.requestSubmit();
        return;
      }
      if (e.key === 'Escape' && state.editingId) {
        const id = state.editingId;
        state.editingId = null;
        state.editDraft = null;
        render();
        els.lists.querySelector(`${taskSel(id)} .title`)?.focus();
      }
    });

    /* ============================================================ Keyboard */
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && cal.open) return; // 캘린더가 자체 처리
      if (e.key === 'Escape' && !els.toast.hidden && !state.editingId) {
        hideToast();
        return;
      }
      const target = e.target;
      const typing = target && (target.tagName === 'INPUT' || target.tagName === 'TEXTAREA' || target.isContentEditable);
      if (typing || e.metaKey || e.ctrlKey || e.altKey) return;
      if (e.key === '/') {
        e.preventDefault();
        els.newTitle.focus();
      }
    });

    /* ============================================================ Theme */
    const darkQuery = window.matchMedia('(prefers-color-scheme: dark)');
    function applyTheme(theme) {
      const root = document.documentElement;
      if (theme === 'light' || theme === 'dark') root.setAttribute('data-theme', theme);
      else root.removeAttribute('data-theme');
      const effectiveDark = theme === 'dark' || (theme !== 'light' && darkQuery.matches);
      els.themeToggle.innerHTML = icon(effectiveDark ? 'sun' : 'moon');
      els.themeToggle.setAttribute('aria-label', effectiveDark ? '라이트 모드로 전환' : '다크 모드로 전환');
      const meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute('content', effectiveDark ? '#151514' : '#f7f7f5');
    }
    function readTheme() {
      try { return localStorage.getItem(THEME_KEY) || localStorage.getItem(LEGACY_KEYS.theme) || 'system'; } catch { return 'system'; }
    }
    els.themeToggle.addEventListener('click', () => {
      const current = readTheme();
      const effectiveDark = current === 'dark' || (current !== 'light' && darkQuery.matches);
      const next = effectiveDark ? 'light' : 'dark';
      try { localStorage.setItem(THEME_KEY, next); } catch { /* ignore */ }
      applyTheme(next);
    });
    darkQuery.addEventListener('change', () => applyTheme(readTheme()));

    /* ============================================================ Mobile keyboard
       iOS Safari는 키보드가 열려도 레이아웃 뷰포트를 줄이지 않으므로
       visualViewport 기준으로 하단 고정 입력창을 끌어올린다. */
    const vv = window.visualViewport;
    if (vv) {
      const fit = () => {
        const gap = Math.round(window.innerHeight - vv.height - vv.offsetTop);
        document.documentElement.style.setProperty('--kb-offset', gap > 0 ? `${gap}px` : '0px');
      };
      vv.addEventListener('resize', fit);
      vv.addEventListener('scroll', fit);
    }

    /* ============================================================ Day rollover
       자정을 넘기거나 탭을 다시 열었을 때 '오늘' 기준을 갱신 */
    function refreshToday() {
      const now = todayKey();
      if (now !== state.today) {
        state.today = now;
        render();
      }
    }
    document.addEventListener('visibilitychange', () => { if (!document.hidden) refreshToday(); });
    setInterval(refreshToday, 60 * 1000);

    /* ============================================================ Multi-tab sync */
    window.addEventListener('storage', (e) => {
      if (e.key === STORAGE_KEY) {
        state.tasks = loadTasks();
        if (state.editingId && !state.tasks.some((t) => t.id === state.editingId)) {
          state.editingId = null;
          state.editDraft = null;
        }
        render();
      }
    });

    /* ============================================================ First-visit notice */
    function initNotice() {
      let seen = false;
      try { seen = localStorage.getItem(NOTICE_KEY) === '1'; } catch { /* ignore */ }
      els.notice.hidden = seen;
      els.noticeDismiss.addEventListener('click', () => {
        try { localStorage.setItem(NOTICE_KEY, '1'); } catch { /* ignore */ }
        els.notice.hidden = true;
        els.newTitle.focus();
      });
    }

    /* ============================================================ Init */
    applyTheme(readTheme());
    initNotice();
    render();
  })();
  </script>
</body>
</html>
